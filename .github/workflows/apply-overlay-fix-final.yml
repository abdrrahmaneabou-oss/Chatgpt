name: Apply final PixelTrigger overlay fix

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - '.github/workflows/apply-overlay-fix-final.yml'

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply deterministic overlay source fix
        id: apply
        shell: bash
        run: |
          set +e
          mkdir -p docs
          python3 tools/apply_overlay_fix.py > docs/OVERLAY_FIX_APPLY.log 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat docs/OVERLAY_FIX_APPLY.log

      - name: Run baseline tests and build APK
        id: build
        if: steps.apply.outputs.code == '0'
        shell: bash
        run: |
          set +e
          mkdir -p docs dist
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee docs/CI_BUILD.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/PixelTrigger-v3-debug.apk
            sha256sum dist/PixelTrigger-v3-debug.apk > dist/PixelTrigger-v3-debug.apk.sha256
          fi
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Write final evidence
        if: always()
        shell: bash
        run: |
          apply_code='${{ steps.apply.outputs.code }}'
          build_code='${{ steps.build.outputs.code }}'
          : "${apply_code:=not-run}"
          : "${build_code:=not-run}"
          {
            echo '# PixelTrigger overlay fix status'
            echo
            echo "Apply code: $apply_code"
            echo "Build code: $build_code"
            echo
            echo 'Required monitor visual diameter: 0.5 mm'
            echo 'Required monitor sampled diameter: 0.5 mm'
            echo 'DetectionEngine expected blob: 3c772ee89cee6cce107409394345bab92c47e0d6'
            if [ -f dist/PixelTrigger-v3-debug.apk ]; then
              echo "APK SHA-256: $(sha256sum dist/PixelTrigger-v3-debug.apk | cut -d' ' -f1)"
            fi
          } > docs/OVERLAY_FIX_STATUS.md

      - name: Commit success or diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PixelTrigger Final Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          apply_code='${{ steps.apply.outputs.code }}'
          build_code='${{ steps.build.outputs.code }}'

          if [ "$apply_code" = '0' ] && [ "$build_code" = '0' ]; then
            git rm -f \
              .github/workflows/fix-v3-overlay-geometry.yml \
              .github/workflows/fix-v3-overlay-geometry-v2.yml \
              .github/workflows/fix-v3-overlay-geometry-v3.yml \
              .github/workflows/diagnose-overlay-fix.yml \
              .github/workflows/apply-overlay-fix-final.yml \
              tools/apply_overlay_fix.py
            git add app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt \
                    app/src/main/java/com/pixeltrigger/app/ui/SensorOverlayView.kt \
                    docs/OVERLAY_FIX_APPLY.log docs/OVERLAY_FIX_STATUS.md docs/CI_BUILD.log \
                    dist/PixelTrigger-v3-debug.apk dist/PixelTrigger-v3-debug.apk.sha256
            git commit -m 'fix: exact 0.5mm monitor, movable circles, smooth overlays'
          else
            git restore app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt \
                        app/src/main/java/com/pixeltrigger/app/ui/SensorOverlayView.kt || true
            git add docs/OVERLAY_FIX_APPLY.log docs/OVERLAY_FIX_STATUS.md
            if [ -f docs/CI_BUILD.log ]; then git add docs/CI_BUILD.log; fi
            git commit -m 'ci: record overlay fix failure diagnostics' || true
          fi
          git push origin HEAD:pixeltrigger-v3-shizuku

      - name: Fail when apply or build failed
        if: steps.apply.outputs.code != '0' || steps.build.outputs.code != '0'
        run: exit 1
