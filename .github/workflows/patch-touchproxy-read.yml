name: Patch touchproxy timerfd read

on:
  push:
    branches:
      - pixeltrigger-v3-input-engine
    paths:
      - '.github/workflows/patch-touchproxy-read.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-input-engine
          fetch-depth: 0
      - name: Patch timerfd read result handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/native/touchproxy/touchproxy.cpp')
          s = p.read_text()
          old = '''            } else if (fd == tfd) {\n                uint64_t expirations{};\n                (void)read(tfd, &expirations, sizeof(expirations));\n                if (active_tap) {\n'''
          new = '''            } else if (fd == tfd) {\n                uint64_t expirations{};\n                ssize_t timer_read;\n                do {\n                    timer_read = read(tfd, &expirations, sizeof(expirations));\n                } while (timer_read < 0 && errno == EINTR);\n                if (timer_read != static_cast<ssize_t>(sizeof(expirations))) {\n                    continue;\n                }\n                if (active_tap) {\n'''
          if old not in s:
              if 'timer_read = read(tfd' in s:
                  print('already patched')
              else:
                  raise SystemExit('expected timerfd snippet not found')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify strict host compile
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            source/native/touchproxy/touchproxy.cpp -o /tmp/touchproxy
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/native/touchproxy/touchproxy.cpp
          if git diff --cached --quiet; then
            echo 'No patch needed.'
          else
            git commit -m 'fix: check timerfd read result [skip ci]'
            git push origin HEAD:pixeltrigger-v3-input-engine
          fi
