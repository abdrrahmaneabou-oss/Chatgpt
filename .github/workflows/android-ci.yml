name: PixelTrigger v4 PixelProbe CI

on:
  push:
    branches: [pixeltrigger-v4-pixelprobe]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixeltrigger-v4-pixelprobe-registered
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v4-pixelprobe
          fetch-depth: 0

      - name: Capture source
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean test build
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee /tmp/v4-gradle.log

      - name: Publish failure log
        if: steps.gradle_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# PixelProbe v4 registered CI failure'
            echo "Source commit: $SOURCE_SHA"
            echo
            tail -n 500 /tmp/v4-gradle.log
          } > docs/PIXELPROBE_V4_FAILURE.log
          git config user.name 'PixelTrigger v4 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/PIXELPROBE_V4_FAILURE.log
          git commit -m "ci: record PixelProbe v4 failure for $SOURCE_SHA" || true
          git pull --rebase origin pixeltrigger-v4-pixelprobe || true
          git push origin HEAD:pixeltrigger-v4-pixelprobe
          exit 1

      - name: Publish verified APK
        if: steps.gradle_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=dist/PixelTrigger-v4-pixelprobe-debug.apk
          test -s "$APK"
          mkdir -p dist docs
          cp "$APK" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "$OUT" > "$OUT.sha256"
          {
            echo '# PixelTrigger v4 PixelProbe status'
            echo '- Unit tests: PASS'
            echo '- APK build: PASS (clean --rerun-tasks)'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Monitor diameter: exactly 0.3 mm'
            echo '- Sampler: maximum 5 fixed direct RGB probe points inside 0.3 mm ellipse'
            echo '- Arming: exactly 3 consecutive WHITE frames'
            echo '- FIRE: first changed frame reaching v4 quorum'
            echo '- Input: one oneway Shizuku AIDL -> Nubia virtualTouchEvent'
            echo '- No Accessibility fallback / retry / second DOWN'
            echo "- APK SHA-256: $SHA"
          } > docs/PIXELPROBE_V4_STATUS.md
          rm -f docs/PIXELPROBE_V4_FAILURE.log
          git config user.name 'PixelTrigger v4 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT" "$OUT.sha256" docs/PIXELPROBE_V4_STATUS.md
          git add -u docs/PIXELPROBE_V4_FAILURE.log || true
          git commit -m "build: publish PixelProbe v4 APK from $SOURCE_SHA" || true
          git pull --rebase origin pixeltrigger-v4-pixelprobe || true
          git push origin HEAD:pixeltrigger-v4-pixelprobe

      - name: Upload APK artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v4-pixelprobe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
