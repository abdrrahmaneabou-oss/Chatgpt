name: PixelTrigger Android app CI

on:
  push:
    branches:
      - pixeltrigger-v3-input-engine
    paths:
      - 'source/app/**'
      - 'source/settings.gradle.kts'
      - '.github/workflows/android-app-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'source/app/**'
      - 'source/settings.gradle.kts'
      - '.github/workflows/android-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle -p source :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pixeltrigger-v3-dev-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
