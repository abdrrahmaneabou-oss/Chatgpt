name: PixelTrigger v3 Android CI

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixeltrigger-v3-shizuku-professional-lab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - name: Enforce Professional Lab v2 UI/source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/migrate_profiler_ui_v2.py
          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove invalid cross-clock frame-age UI'
            git push origin HEAD:pixeltrigger-v3-shizuku
          fi

      - name: Capture source provenance
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean, test, and build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee /tmp/pixeltrigger-gradle.log

      - name: Persist compiler failure diagnostics
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# PixelTrigger CI BUILD FAILURE'
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 300 /tmp/pixeltrigger-gradle.log
            echo '```'
          } > docs/CI_BUILD_FAILURE.log
          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/CI_BUILD_FAILURE.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: record build failure from $SOURCE_SHA"
            git push origin HEAD:pixeltrigger-v3-shizuku || true
          fi

      - name: Stop after compiler failure
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Publish verified Professional Lab APK to latest branch tip
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          # Preserve the exact binary built/tested from SOURCE_SHA before moving the
          # git worktree. Another workflow is allowed to publish the generic debug APK;
          # this workflow owns only the professional direct-fire artifact.
          cp "$APK" /tmp/PixelTrigger-professional-lab.apk
          BUILT_SHA=$(sha256sum /tmp/PixelTrigger-professional-lab.apk | cut -d' ' -f1)

          # Publish on top of the latest remote tip so a concurrent generic build-bot
          # commit cannot make this push non-fast-forward or overwrite this artifact.
          git fetch origin pixeltrigger-v3-shizuku
          git reset --hard origin/pixeltrigger-v3-shizuku

          mkdir -p dist docs
          cp /tmp/PixelTrigger-professional-lab.apk dist/PixelTrigger-v3-direct-1ms-debug.apk
          DIRECT_SHA=$(sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk | cut -d' ' -f1)
          test "$BUILT_SHA" = "$DIRECT_SHA"
          printf '%s  %s\n' "$DIRECT_SHA" 'dist/PixelTrigger-v3-direct-1ms-debug.apk' > dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256
          {
            echo '# PixelTrigger immediate-fire + Professional Latency Lab v2 CI status'
            echo
            echo '- Unit tests: PASS'
            echo '- APK build: PASS (clean --rerun-tasks)'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Monitor diameter: 0.3 mm'
            echo '- Arming: exactly 3 consecutive WHITE frames'
            echo '- FIRE: first frame after ARMED that is no longer holding-white; no wait for DARK/black'
            echo '- Profiler v2 invariant: absolute Image.timestamp is NEVER subtracted from elapsedRealtimeNanos'
            echo '- Legacy quick-stat frameAge cross-clock subtraction: REMOVED from source/UI'
            echo '- Clock-safe app/UserService stages: SystemClock.elapsedRealtimeNanos only'
            echo '- Foreign Image.timestamp: consecutive delta only; absolute frame age intentionally unavailable'
            echo '- Capture cadence observer: PixelSampler entry interval on every processed frame, rolling 512 frames'
            echo '- Capture baseline: fixed 50 ms incident threshold during first 8 intervals, then max(50 ms, P50 x 4)'
            echo '- Capture stats: P50/P90/P95/P99/MAX plus cadence-incident detection and clock-safe verdict'
            echo '- FIRE history: rolling 128 shots with P50/P90/P95/P99/MAX and top decision-to-DOWN outliers'
            echo '- AIDL semantics: app call-return and app-to-UserService arrival are separate; no fake Binder-kernel attribution'
            echo '- Measurement boundaries are explicit: physical OLED-to-capture and exact game-consumption instant are not invented'
            echo '- Profiler overhead: primitive timestamps/array writes on hot paths; sorting/formatting only on diagnostics read'
            echo '- Shizuku UserService interface version: 11 (prevents stale profiler daemon reuse)'
            echo '- Tap backend: Shizuku shell -> Nubia InputManager.virtualTouchEvent -> InputReader/NubiaGamepad'
            echo '- Exactly one tap: one DOWN + one UP; no retry / backup press / Accessibility fallback'
            echo '- Requested DOWN/UP separation: ~1 ms after DOWN returns'
            echo "- APK SHA-256: $DIRECT_SHA"
          } > docs/DIRECT_FIRE_STATUS.md
          rm -f docs/CI_BUILD_FAILURE.log

          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/PixelTrigger-v3-direct-1ms-debug.apk \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256 \
                  docs/DIRECT_FIRE_STATUS.md
          git add -u docs/CI_BUILD_FAILURE.log || true
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified professional-latency-v2 APK from $SOURCE_SHA"
            git push origin HEAD:pixeltrigger-v3-shizuku
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-direct-1ms-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
