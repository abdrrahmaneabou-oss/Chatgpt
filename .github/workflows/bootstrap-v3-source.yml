name: Bootstrap PixelTrigger v3 source

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - 'bootstrap/source.part*'
      - '.github/workflows/bootstrap-v3-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore clean source snapshot
        run: |
          cat bootstrap/source.part* | base64 -d > /tmp/ptv3-source.tar.xz
          echo '9b485ac4500b58bf4989176eef3541bbca0f1d767822de3c796f3ddff344ee83  /tmp/ptv3-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/ptv3-source.tar.xz -C .

      - name: Test baseline and build
        id: build
        shell: bash
        run: |
          mkdir -p docs
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee docs/CI_BUILD.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '# PixelTrigger v3 CI build status'
            echo
            if [ "$code" -eq 0 ]; then echo '**PASS**'; else echo '**FAIL**'; fi
            echo
            echo "Gradle exit code: $code"
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "APK SHA-256: $(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
            fi
          } > docs/CI_BUILD_STATUS.md
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit recovered source and build status
        run: |
          rm -rf bootstrap
          git config user.name 'PixelTrigger Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: bootstrap PixelTrigger v3 no-root Shizuku source' || true
          git push origin HEAD:pixeltrigger-v3-shizuku

      - name: Fail workflow when Android build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
