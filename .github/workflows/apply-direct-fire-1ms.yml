name: Apply direct first-frame 1ms fire

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - '.github/workflows/apply-direct-fire-1ms.yml'

permissions:
  contents: write

jobs:
  patch-test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply direct-fire patch
        run: python3 tools/apply_direct_fire_1ms.py

      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Publish APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist docs
          cp app/build/outputs/apk/debug/app-debug.apk dist/PixelTrigger-v3-direct-1ms-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/PixelTrigger-v3-debug.apk
          sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk > dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256
          sha256sum dist/PixelTrigger-v3-debug.apk > dist/PixelTrigger-v3-debug.apk.sha256
          {
            echo '# PixelTrigger direct-fire build'
            echo
            echo '- Arming thresholds/frame count preserved from v2.12.'
            echo '- FIRE rule: first captured frame after ARMED that no longer satisfies isArmingWhite().' 
            echo '- No meaningfulChange, holdingWhite, changedFrames, or capability-flag gate in the FIRE path.'
            echo '- Input backend: Shizuku shell UID 2000 -> InputManager.injectInputEvent.'
            echo '- Accessibility fallback: none.'
            echo '- Requested DOWN/UP event-time separation: 1 ms.'
            echo "- APK SHA-256: $(sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk | cut -d' ' -f1)"
          } > docs/DIRECT_FIRE_STATUS.md

      - name: Commit tested source and APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PixelTrigger Direct Fire Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-direct-fire-1ms.yml tools/apply_direct_fire_1ms.py
          git add app/src/main/java/com/pixeltrigger/app/engine/DetectionEngine.kt \
                  app/src/main/java/com/pixeltrigger/app/input/ShizukuTapEngine.kt \
                  app/src/main/java/com/pixeltrigger/app/input/ShizukuInputUserService.kt \
                  app/src/test/java/com/pixeltrigger/app/engine/DetectionEngineBaselineTest.kt \
                  docs/DIRECT_FIRE_STATUS.md \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256 \
                  dist/PixelTrigger-v3-debug.apk \
                  dist/PixelTrigger-v3-debug.apk.sha256
          git commit -m 'fix: fire on first non-white frame with direct 1ms Shizuku tap'
          git push origin HEAD:pixeltrigger-v3-shizuku
