name: PixelTrigger input engine CI

on:
  push:
    branches:
      - pixeltrigger-v3-input-engine
    paths:
      - 'source/**'
      - '.github/workflows/input-engine-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/input-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run frozen v2.12 engine tests
        run: gradle -p source :engine-baseline-test:test --no-daemon --stacktrace

  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile touchproxy with warnings as errors
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            source/native/touchproxy/touchproxy.cpp \
            -o /tmp/touchproxy
          /tmp/touchproxy --probe || test $? -eq 8

  native-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Configure and build touchproxy
        run: |
          cmake -S source/native/touchproxy -B build/touchproxy-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/touchproxy-${{ matrix.abi }} --parallel 2
          file build/touchproxy-${{ matrix.abi }}/touchproxy
      - uses: actions/upload-artifact@v4
        with:
          name: touchproxy-${{ matrix.abi }}
          path: build/touchproxy-${{ matrix.abi }}/touchproxy
          if-no-files-found: error
