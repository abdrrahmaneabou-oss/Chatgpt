name: PixelTrigger v3 UltraFast Predictive CI

on:
  push:
    branches: [pixeltrigger-v3-ultrafast-predictive]
    paths:
      - 'app/**'
      - 'scripts/apply_ultrafast_predictive.py'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixeltrigger-v3-ultrafast-predictive
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-ultrafast-predictive
          fetch-depth: 0

      - name: Apply deterministic profiler-free hot-path migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_ultrafast_predictive.py
          if ! git diff --quiet -- app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt; then
            git config user.name 'PixelTrigger UltraFast CI'
            git config user.email 'actions@users.noreply.github.com'
            git add app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
            git commit -m 'perf: strip timing overhead and use direct fireFast path'
            git push origin HEAD:pixeltrigger-v3-ultrafast-predictive
          fi

      - name: Capture exact source provenance
        shell: bash
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean, test, and build debug APK
        shell: bash
        run: gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Publish verified UltraFast Predictive APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist docs
          cp "$APK" dist/PixelTrigger-v3-ultrafast-predictive-debug.apk
          SHA=$(sha256sum dist/PixelTrigger-v3-ultrafast-predictive-debug.apk | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" 'dist/PixelTrigger-v3-ultrafast-predictive-debug.apk' > dist/PixelTrigger-v3-ultrafast-predictive-debug.apk.sha256
          {
            echo '# PixelTrigger UltraFast Predictive status'
            echo
            echo '- Unit tests: PASS'
            echo '- APK build: PASS (clean --rerun-tasks)'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Profiler: REMOVED / OFF'
            echo '- Monitor diameter: 0.3 mm'
            echo '- Capture scale: 50%'
            echo '- Capture thread: THREAD_PRIORITY_URGENT_DISPLAY'
            echo '- Arming baseline: exactly 3 consecutive WHITE frames, averaged'
            echo '- Predictive FIRE: first meaningful weakening relative to the 3-frame white baseline'
            echo '- Predictive coverage drop gate: 0.15'
            echo '- Predictive uniform luminance drop gate: 18 with minimum-channel drop >= 14'
            echo '- Hard fallback: white coverage below 0.35'
            echo '- FIRE path: DetectionEngine -> ShizukuTapEngine.fireFast -> one oneway AIDL -> Nubia virtualTouchEvent'
            echo '- No TapCoordinator allocation/AtomicLong/timestamp on FIRE hot path'
            echo '- Exactly one DOWN + one UP; no retry / backup tap / Accessibility fallback'
            echo '- Requested DOWN/UP contact separation: ~1 ms after DOWN returns'
            echo "- APK SHA-256: $SHA"
          } > docs/ULTRAFAST_PREDICTIVE_STATUS.md

          git config user.name 'PixelTrigger UltraFast CI'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/PixelTrigger-v3-ultrafast-predictive-debug.apk \
                  dist/PixelTrigger-v3-ultrafast-predictive-debug.apk.sha256 \
                  docs/ULTRAFAST_PREDICTIVE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish ultrafast predictive APK from $SOURCE_SHA"
            git push origin HEAD:pixeltrigger-v3-ultrafast-predictive
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-ultrafast-predictive-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
