name: PixelTrigger v3 Android CI

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixeltrigger-v3-shizuku-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - name: Capture source provenance
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean, test, and build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee /tmp/pixeltrigger-gradle.log

      - name: Persist compiler failure diagnostics
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# PixelTrigger CI BUILD FAILURE'
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '```text'
            tail -n 260 /tmp/pixeltrigger-gradle.log
            echo '```'
          } > docs/CI_BUILD_FAILURE.log
          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/CI_BUILD_FAILURE.log
          if ! git diff --cached --quiet; then
            git commit -m "ci: record build failure from $SOURCE_SHA"
            git push origin HEAD:pixeltrigger-v3-shizuku
          fi

      - name: Stop after compiler failure
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Publish verified APK to branch
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist docs
          cp "$APK" dist/PixelTrigger-v3-debug.apk
          cp "$APK" dist/PixelTrigger-v3-direct-1ms-debug.apk
          DEBUG_SHA=$(sha256sum dist/PixelTrigger-v3-debug.apk | cut -d' ' -f1)
          DIRECT_SHA=$(sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk | cut -d' ' -f1)
          test "$DEBUG_SHA" = "$DIRECT_SHA"
          printf '%s  %s\n' "$DEBUG_SHA" 'dist/PixelTrigger-v3-debug.apk' > dist/PixelTrigger-v3-debug.apk.sha256
          printf '%s  %s\n' "$DIRECT_SHA" 'dist/PixelTrigger-v3-direct-1ms-debug.apk' > dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256
          {
            echo '# PixelTrigger immediate-fire + ns-profiler CI status'
            echo
            echo '- Unit tests: PASS'
            echo '- APK build: PASS (clean --rerun-tasks)'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Monitor diameter: 0.3 mm'
            echo '- Arming: exactly 3 consecutive WHITE frames'
            echo '- FIRE: first frame after ARMED that is no longer holding-white; no wait for DARK/black'
            echo '- Input readiness: diagnostics cannot delay the detector FIRE transition'
            echo '- Nubia hot path: readiness is latched after successful warm-up and cleared only on real disconnect / explicit unsafe result'
            echo '- Profiler clock: SystemClock.elapsedRealtimeNanos across app + Shizuku UserService'
            echo '- Profiler stages: frame/callback/sampling/detection/request/Binder queue/UserService dispatch/Nubia DOWN/hold/Nubia UP'
            echo '- Profiler history: last 64 shots with P50/P95/MAX and automatic largest-stage culprit'
            echo '- Profiler overhead policy: primitive timestamps only on FIRE; formatting/statistics only when diagnostics UI is opened'
            echo '- Shizuku UserService interface version: 10 (prevents stale v9 daemon reuse)'
            echo '- Tap backend: Shizuku shell -> Nubia InputManager.virtualTouchEvent -> InputReader/NubiaGamepad'
            echo '- Exactly one tap: one DOWN + one UP; no retry / backup press / Accessibility fallback'
            echo '- Requested DOWN/UP separation: ~1 ms after DOWN returns'
            echo "- APK SHA-256: $DIRECT_SHA"
          } > docs/DIRECT_FIRE_STATUS.md
          rm -f docs/CI_BUILD_FAILURE.log

          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/PixelTrigger-v3-debug.apk \
                  dist/PixelTrigger-v3-debug.apk.sha256 \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256 \
                  docs/DIRECT_FIRE_STATUS.md
          git add -u docs/CI_BUILD_FAILURE.log || true
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified ns-profiler APK from $SOURCE_SHA"
            git push origin HEAD:pixeltrigger-v3-shizuku
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-direct-1ms-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
