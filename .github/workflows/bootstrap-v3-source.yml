name: PixelTrigger v3 verified build

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/bootstrap-v3-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test baseline and build APK
        id: build
        shell: bash
        run: |
          mkdir -p docs
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee docs/CI_BUILD.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo '# PixelTrigger v3 CI build status'
            echo
            if [ "$code" -eq 0 ]; then echo '**PASS**'; else echo '**FAIL**'; fi
            echo
            echo "Gradle exit code: $code"
            echo "Source commit: $GITHUB_SHA"
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "APK SHA-256: $(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
            fi
          } > docs/CI_BUILD_STATUS.md
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit build evidence
        if: always()
        run: |
          git config user.name 'PixelTrigger Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/CI_BUILD.log docs/CI_BUILD_STATUS.md
          git commit -m 'ci: record PixelTrigger v3 build result' || true
          git push origin HEAD:pixeltrigger-v3-shizuku

      - name: Upload debug APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Fail workflow when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
