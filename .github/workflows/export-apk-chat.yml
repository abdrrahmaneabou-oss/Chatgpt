name: Export PixelTrigger APK for chat

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - '.github/workflows/export-apk-chat.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0
      - name: Verify latest direct-fire APK exists
        run: |
          test -f dist/PixelTrigger-v3-direct-1ms-debug.apk
          sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-direct-1ms-debug-apk
          path: dist/PixelTrigger-v3-direct-1ms-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Publish workflow run id
        run: |
          mkdir -p docs
          printf '%s\n' "$GITHUB_RUN_ID" > docs/APK_EXPORT_RUN_ID.txt
          git config user.name 'PixelTrigger Export Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/APK_EXPORT_RUN_ID.txt
          git commit -m 'ci: record direct-fire APK export run id' || true
          git push origin HEAD:pixeltrigger-v3-shizuku
