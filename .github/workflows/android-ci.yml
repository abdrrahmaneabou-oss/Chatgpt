name: PixelTrigger v3 Android CI

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Publish tested APK to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist docs
          cp app/build/outputs/apk/debug/app-debug.apk dist/PixelTrigger-v3-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/PixelTrigger-v3-direct-1ms-debug.apk
          sha256sum dist/PixelTrigger-v3-debug.apk > dist/PixelTrigger-v3-debug.apk.sha256
          sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk > dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256
          {
            echo '# PixelTrigger direct-fire CI status'
            echo
            echo '- Unit tests: PASS'
            echo '- APK build: PASS'
            echo '- Arming: original v2.12 white thresholds + 3 consecutive white frames'
            echo '- FIRE: only DARK/near-black after ARMED (luminance threshold + near-black channel guard)'
            echo '- NEUTRAL: stays ARMED and never arms from zero'
            echo '- Tap backend: Shizuku shell -> Nubia InputManager.virtualTouchEvent -> InputReader/NubiaGamepad'
            echo '- Virtual pointer params: keyCode=-4, DOWN=0, UP=2, mode=1, gamepadId=-2'
            echo '- Accessibility fallback: none'
            echo '- Requested DOWN/UP separation: ~1 ms after DOWN returns'
            echo '- Generic InputManager.injectInputEvent: not used'
            echo "- APK SHA-256: $(sha256sum dist/PixelTrigger-v3-debug.apk | cut -d' ' -f1)"
          } > docs/DIRECT_FIRE_STATUS.md

          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/PixelTrigger-v3-debug.apk \
                  dist/PixelTrigger-v3-debug.apk.sha256 \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256 \
                  docs/DIRECT_FIRE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish tested direct-fire APK'
            git push origin HEAD:pixeltrigger-v3-shizuku
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-direct-1ms-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
