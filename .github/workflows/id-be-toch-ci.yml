name: ID BE TOCH Diagnostic APK

on:
  push:
    branches: ["ID-BE-TOCH"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build diagnostic APK
        run: ./gradlew :shoulderdiag:assembleDebug --stacktrace

      - name: Publish APK into dist
        run: |
          mkdir -p dist
          cp shoulderdiag/build/outputs/apk/debug/shoulderdiag-debug.apk dist/ID-BE-TOCH-debug.apk
          sha256sum dist/ID-BE-TOCH-debug.apk | tee dist/ID-BE-TOCH-debug.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ID-BE-TOCH-debug
          path: |
            dist/ID-BE-TOCH-debug.apk
            dist/ID-BE-TOCH-debug.apk.sha256

      - name: Commit APK to branch
        run: |
          git config user.name "ID BE TOCH CI"
          git config user.email "actions@users.noreply.github.com"
          git add dist/ID-BE-TOCH-debug.apk dist/ID-BE-TOCH-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "build: publish ID BE TOCH diagnostic APK [skip ci]"
            git push
          fi
