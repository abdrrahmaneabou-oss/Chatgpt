name: PixelTrigger v3 Android CI

on:
  push:
    branches: [pixeltrigger-v3-shizuku]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pixeltrigger-v3-shizuku
          fetch-depth: 0

      - name: Capture source provenance
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean, test, and build debug APK
        run: gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Publish verified APK to branch
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist docs
          cp "$APK" dist/PixelTrigger-v3-debug.apk
          cp "$APK" dist/PixelTrigger-v3-direct-1ms-debug.apk
          DEBUG_SHA=$(sha256sum dist/PixelTrigger-v3-debug.apk | cut -d' ' -f1)
          DIRECT_SHA=$(sha256sum dist/PixelTrigger-v3-direct-1ms-debug.apk | cut -d' ' -f1)
          test "$DEBUG_SHA" = "$DIRECT_SHA"
          printf '%s  %s\n' "$DEBUG_SHA" 'dist/PixelTrigger-v3-debug.apk' > dist/PixelTrigger-v3-debug.apk.sha256
          printf '%s  %s\n' "$DIRECT_SHA" 'dist/PixelTrigger-v3-direct-1ms-debug.apk' > dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256
          {
            echo '# PixelTrigger direct-fire CI status'
            echo
            echo '- Unit tests: PASS'
            echo '- APK build: PASS (clean --rerun-tasks)'
            echo "- Source commit: $SOURCE_SHA"
            echo '- Monitor diameter: 0.3 mm'
            echo '- Arming: 3 consecutive WHITE frames; input readiness never resets detection state'
            echo '- FIRE: first DARK/near-black frame after ARMED, only when Nubia/Shizuku input is ready'
            echo '- Input unavailable while DARK: stays ARMED; FIRE is not consumed'
            echo '- NEUTRAL: stays ARMED and never arms from zero'
            echo '- Tap backend: Shizuku shell -> Nubia InputManager.virtualTouchEvent -> InputReader/NubiaGamepad'
            echo '- Exactly one tap: one DOWN + one UP; no retry / backup press / Accessibility fallback'
            echo '- Requested DOWN/UP separation: ~1 ms after DOWN returns'
            echo "- APK SHA-256: $DIRECT_SHA"
          } > docs/DIRECT_FIRE_STATUS.md

          git config user.name 'PixelTrigger Android CI'
          git config user.email 'actions@users.noreply.github.com'
          git add dist/PixelTrigger-v3-debug.apk \
                  dist/PixelTrigger-v3-debug.apk.sha256 \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk \
                  dist/PixelTrigger-v3-direct-1ms-debug.apk.sha256 \
                  docs/DIRECT_FIRE_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified direct-fire APK from $SOURCE_SHA"
            git push origin HEAD:pixeltrigger-v3-shizuku
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelTrigger-v3-direct-1ms-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
